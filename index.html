<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuestionario inicial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Poppins:ital,wght@0,300;0,400;0,500;1,300&display=swap">
<style>
/* Layout: una columna estrecha tipo formulario editorial; cada bloque es una tarjeta blanca sobre lienzo rosado. Paleta marrón Roasted + rosa bebé palo · tipografía de Roasted (Pinyon Script + Poppins). */
:root{
  color-scheme: light;
  /* marrón Roasted + rosa bebé palo */
  --ink:#241915;
  --ink-2:#3A2C25;
  --cream:#F4EDE3;
  --rosa:#EBC3CA;
  --rosa-soft:#F6DDE1;
  --rosa-deep:#B97A87;
  --bg:#F9ECEE;
  --bg-elevated:#FFFAF8;
  --bg-deep:#FBF2F1;
  --border:#EDD6D9;
  --border-strong:#DDBAC0;
  --text:#241915;
  --text-dim:#7A6A60;
  --text-faint:#A39280;
  --accent:#8C4E5B;
  --accent-deco:#E3AEB8;
  --gradient:linear-gradient(135deg,#241915 0%,#3A2C25 100%);
  --gradient-text:linear-gradient(135deg,#8C4E5B 0%,#B97A87 100%);
  --gradient-text-large:linear-gradient(135deg,#B97A87 0%,#E3AEB8 100%);
  --green-text:#1f7a3a;
  --red-text:#b51d12;
  --shadow-sm:0 1px 3px rgba(36,25,21,.05),0 1px 2px rgba(36,25,21,.06);
  --shadow-md:0 4px 12px rgba(36,25,21,.07),0 2px 4px rgba(36,25,21,.04);
  --shadow-lg:0 12px 32px rgba(36,25,21,.10),0 4px 8px rgba(36,25,21,.04);
  --font-sans:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --script:'Pinyon Script','Snell Roundhand','Apple Chancery',cursive;
  --display:var(--font-sans);
  --head:var(--font-sans);
  --font-mono:var(--font-sans);
  --ease:cubic-bezier(.22,1,.36,1);
  --bounce:cubic-bezier(.34,1.32,.64,1);
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{background:var(--bg);color:var(--text);font-family:var(--font-sans);font-weight:300;font-size:17px;line-height:1.75;margin:0;-webkit-font-smoothing:antialiased}
::selection{background:var(--rosa);color:var(--ink)}

.aurora{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.aurora span{position:absolute;border-radius:50%;filter:blur(220px);opacity:.32;mix-blend-mode:multiply}
.aurora .a1{width:520px;height:520px;background:rgba(235,195,202,.75);top:-200px;left:-160px}
.aurora .a2{width:460px;height:460px;background:rgba(214,170,150,.45);top:40%;right:-220px}

.wrap{position:relative;z-index:1;max-width:720px;margin:0 auto;padding-inline:20px;padding-block:40px 96px}

.brand{font-family:var(--head);font-weight:500;letter-spacing:-.01em;font-size:18px;color:var(--text)}
.hero{display:flex;flex-direction:column;gap:14px;padding-block:28px 32px}
.eyebrow{font-size:12px;font-weight:500;letter-spacing:.16em;text-transform:uppercase;background:var(--gradient-text);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.title-lockup{display:block}
h1 .row{display:inline-flex;align-items:baseline;flex-wrap:wrap;column-gap:.18em}
h1 .script{font-family:var(--script);font-weight:400;text-transform:none;letter-spacing:0;font-size:1.45em;line-height:.6;color:var(--rosa-deep);display:inline-block;padding:0 .12em .1em 0;margin-left:-.02em;clip-path:inset(-20% 100% -40% 0);transition:clip-path 1.3s var(--ease) .75s}
html:not(.anim) h1 .script,.title-lockup.in h1 .script{clip-path:inset(-20% -10% -40% -5%)}
h1{font-family:var(--font-sans);font-weight:300;text-transform:uppercase;font-size:clamp(40px,10.5vw,80px);line-height:1.02;letter-spacing:.01em;margin:0;text-wrap:balance;color:var(--ink)}
h1 .g{background:var(--gradient-text-large);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 10px 30px rgba(185,122,135,.25))}
.lead{font-size:18px;font-style:italic;font-weight:300;color:var(--text-dim);max-width:58ch;margin:0}

.progress{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(249,236,238,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border);margin-inline:-20px;padding:10px 20px;display:flex;align-items:center;gap:14px}
.bar{flex:1;height:6px;border-radius:99px;background:var(--bg-deep);overflow:hidden;min-width:0}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--rosa-deep),var(--ink-2));border-radius:99px;transition:width .4s ease}
.count{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}

form{display:flex;flex-direction:column;gap:22px;margin-top:26px}
.section{background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;transition:box-shadow .3s,border-color .3s}
.section.open{box-shadow:var(--shadow-md);border-color:var(--border-strong)}
.section-head{appearance:none;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%;display:flex;align-items:center;gap:12px;padding:22px 24px;border-radius:20px}
.section-head:focus-visible{outline:3px solid var(--rosa-deep);outline-offset:-3px}
.section-head h2{flex:1;min-width:0}
.section-head .prog{font-size:13px;font-weight:500;color:var(--text-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.section-head .prog.full{color:var(--accent)}
.chev{flex:none;width:34px;height:34px;border-radius:50%;background:var(--rosa-soft);color:var(--ink);display:grid;place-items:center;transition:transform .5s var(--bounce),background .3s}
.chev svg{width:14px;height:14px}
.section-head:hover .chev{background:var(--rosa)}
.section.open .chev{transform:rotate(180deg);background:var(--ink);color:var(--rosa)}
.section-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.section.open .section-body{grid-template-rows:1fr}
.section-inner{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:22px;padding:0 24px}
.section.open .section-inner{padding-bottom:28px}
.section-inner .q{opacity:0;transform:translateY(30px) scale(.97);transition:opacity .5s var(--ease) var(--d,0s),transform .9s var(--bounce) var(--d,0s)}
.section.open .section-inner .q.in{opacity:1;transform:none}
.section-head .num{font-family:var(--font-mono);font-size:13px;font-weight:500;color:var(--accent);letter-spacing:.04em}
.section h2{font-family:var(--head);font-size:21px;line-height:1.2;font-weight:400;text-transform:uppercase;letter-spacing:.05em;margin:0}

.q{display:flex;flex-direction:column;gap:10px}
.q label{display:flex;gap:12px;align-items:flex-start;font-weight:400;font-size:17px;line-height:1.5;cursor:text}
.q .n{flex:none;width:28px;height:28px;border-radius:8px;background:var(--ink);color:var(--rosa);font-family:var(--font-mono);font-size:13px;font-weight:500;display:grid;place-items:center;margin-top:-1px;font-variant-numeric:tabular-nums}
.q .txt{min-width:0}
textarea{width:100%;min-height:84px;resize:vertical;font:inherit;font-size:16px;line-height:1.6;color:var(--text);background:var(--bg-deep);border:1px solid var(--border);border-radius:14px;padding:12px 14px;transition:border-color .2s,box-shadow .2s,background .2s}
textarea::placeholder{color:var(--text-faint)}
textarea:hover{border-color:var(--border-strong)}
textarea:focus{outline:none;background:#fff;border-color:var(--accent-deco);box-shadow:0 0 0 4px rgba(235,195,202,.45)}

.actions{margin-top:30px;display:flex;flex-direction:column;align-items:stretch;gap:12px}
.actions .btn-primary{font-size:17px;padding:16px 24px}
.btn{appearance:none;border:0;border-radius:999px;font:inherit;font-weight:500;font-size:16px;padding:13px 22px;cursor:pointer;transition:transform .15s,box-shadow .2s,opacity .2s}
.btn-primary{background:var(--gradient);color:var(--cream);box-shadow:var(--shadow-md)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.btn-primary:disabled{opacity:.55;cursor:default;transform:none}
.btn-ghost{background:var(--bg-elevated);color:var(--ink);border:1px solid var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--cream)}
.btn:focus-visible{outline:3px solid var(--rosa-deep);outline-offset:2px}
.status{font-size:14px;line-height:1.45;color:var(--text-dim);flex:1 1 220px;min-width:0}
.status.ok{color:var(--green-text)}
.status.err{color:var(--red-text)}

.owner{margin-top:40px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow-sm);padding:24px}
.owner h2{font-family:var(--head);font-size:20px;font-weight:400;text-transform:uppercase;letter-spacing:.05em;margin:0 0 4px}
.owner .sub{color:var(--text-dim);font-size:15px;margin:0 0 16px}
.resp{border-top:1px solid var(--border);padding-block:12px}
.resp summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;font-weight:500}
.resp summary .meta{font-family:var(--font-mono);font-size:12px;font-weight:500;color:var(--text-dim)}
.resp dl{margin:12px 0 0;display:grid;gap:12px}
.resp dt{font-weight:500;font-size:15px}
.resp dd{margin:2px 0 0;font-size:15px;color:var(--text);white-space:pre-wrap;overflow-wrap:anywhere}
.resp dd.empty{color:var(--text-faint);font-style:italic}

/* intro: el nombre sale letra a letra y la pantalla se abre hacia arriba (como Roasted) */
.intro{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--rosa);display:grid;place-items:center;clip-path:inset(0 0 0 0);transition:clip-path 1.1s var(--ease)}
.intro.done{clip-path:inset(0 0 100% 0)}
.intro .giant{font-family:var(--font-sans);font-weight:300;text-transform:uppercase;letter-spacing:.06em;font-size:clamp(64px,17vw,180px);line-height:1;white-space:nowrap}
.intro .ch{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.08em}
.intro .ch>span{display:inline-block;transform:translateY(110%);transition:transform 1.1s var(--ease);transition-delay:calc(var(--i)*60ms)}
.intro.in .ch>span{transform:none}
.intro-bar{position:absolute;left:50%;bottom:16%;width:160px;height:2px;background:rgba(244,237,227,.15);transform:translateX(-50%);border-radius:2px;overflow:hidden}
.intro-bar i{display:block;height:100%;width:0;background:var(--rosa);transition:width 1.3s var(--ease)}
/* pop up: sube desde abajo con un rebote pequeño al entrar en pantalla */
html.anim [data-pop]{opacity:0;transform:translateY(46px) scale(.96);transition:opacity .7s var(--ease) var(--d,0s),transform 1s var(--bounce) var(--d,0s)}
html.anim [data-pop].in{opacity:1;transform:none}
@media (max-width:480px){
  .section{border-radius:18px}
  .section-head{padding:20px 18px}
  .section-inner{padding:0 18px}
  .section-head h2{font-size:22px}
  .btn{flex:1 1 auto}
}
</style>
</head>
<body>


<div class="aurora" aria-hidden="true"><span class="a1"></span><span class="a2"></span></div>

<main class="wrap">
  <header class="hero">
    <p class="eyebrow" data-pop>Plan de nutrición · Fuerza</p>
    <div class="title-lockup" data-pop style="--d:.08s">
      <h1>Cuestionario inicial</h1>
    </div>
    <p class="lead" data-pop style="--d:.16s">Sé todo lo extensa que quieras en las respuestas. Todas las respuestas me ayudan a hacer el plan lo más adaptado a ti posible.</p>
  </header>

  <div class="progress" role="status" aria-live="polite">
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <span class="count" id="count">0 / 26</span>
  </div>

  <form id="form" novalidate></form>

  <div class="actions">
    <button type="button" class="btn btn-ghost" id="copy">Guardar y continuar más tarde</button>
    <button type="button" class="btn btn-primary" id="save">Enviar respuestas</button>
    <p class="status" id="status">Cuando termines, pulsa «Enviar respuestas».</p>
  </div>

</main>

<script>
const SECTIONS = [
  ["Datos básicos", [
    "Edad, altura, peso actual.",
    "¿Has tenido cambios de peso relevantes en los últimos meses?",
    "¿Qué horario laboral tienes (mañana, tarde, turnos, noches)?"
  ]],
  ["Salud", [
    "¿Tienes alguna enfermedad diagnosticada (tiroides, anemia, ovario poliquístico, digestiva, celiaquía…)?",
    "¿Tomas alguna medicación o suplemento?",
    "¿Tienes alergias o intolerancias alimentarias?",
    "¿Tienes una analítica reciente? Si es así, compártela.",
    "¿Tienes alguna lesión, actual o pasada, que limite el entrenamiento?",
    "¿Tienes molestias digestivas habituales (hinchazón, estreñimiento, reflujo)?"
  ]],
  ["Ciclo menstrual", [
    "¿Tu ciclo menstrual es regular?",
    "¿Tomas anticonceptivos hormonales (píldora, DIU hormonal, anillo…)?",
    "¿Notas cambios de hambre, energía o rendimiento según la fase del ciclo?"
  ]],
  ["Entrenamiento", [
    "¿Entrenas o haces algún tipo de dieta actualmente?",
    "¿Cuántos días podrías adaptar para entrenar a la semana?",
    "¿Tienes ejercicios de preferencia o que sientas que te funcionen?",
    "¿Haces otra actividad además de la fuerza (cardio, deportes, clases)?",
    "¿Cuántos pasos das de media al día?"
  ]],
  ["Hábitos alimentarios", [
    "¿Cuántas comidas haces?",
    "¿Qué alimentos te encantan?",
    "¿Cuáles no soportas?",
    "¿Cómo es un día normal de comidas para ti?"
  ]],
  ["Relación con la comida", [
    "¿Cómo influiría en ti pesarte de forma frecuente?"
  ]],
  ["Sueño y estrés", [
    "¿Cuántas horas duermes? ¿Descansas bien?",
    "¿Cenas justo antes de acostarte?",
    "Del 1 al 10, ¿qué nivel de estrés tienes ahora mismo?"
  ]],
  ["Objetivos", [
    "¿Qué quieres conseguir actualmente y cuáles son tus objetivos?"
  ]]
];

// Lista plana con ids estables (q1…q26)
const QUESTIONS = [];
SECTIONS.forEach(([title, qs], si) => qs.forEach((text, qi) => {
  QUESTIONS.push({ id: "q" + (QUESTIONS.length + 1), section: title, local: qi + 1, text });
}));
const TOTAL = QUESTIONS.length;
const DRAFT_KEY = "cuestionario-inicial-borrador";

const form = document.getElementById("form");
const statusEl = document.getElementById("status");
const saveBtn = document.getElementById("save");
const copyBtn = document.getElementById("copy");

// Render del formulario
SECTIONS.forEach(([title, qs], si) => {
  const sec = document.createElement("section");
  sec.className = "section";
  sec.dataset.pop = "";
  const head = document.createElement("button");
  head.type = "button";
  head.className = "section-head";
  head.setAttribute("aria-expanded", "false");
  head.setAttribute("aria-controls", "body-" + si);
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = String(si + 1).padStart(2, "0");
  const h2 = document.createElement("h2");
  h2.textContent = title;
  const prog = document.createElement("span");
  prog.className = "prog";
  const chev = document.createElement("span");
  chev.className = "chev";
  chev.setAttribute("aria-hidden", "true");
  chev.innerHTML = '<svg viewBox="0 0 14 14" fill="none"><path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  head.append(num, h2, prog, chev);
  const body = document.createElement("div");
  body.className = "section-body";
  body.id = "body-" + si;
  body.inert = true;
  const inner = document.createElement("div");
  inner.className = "section-inner";
  body.append(inner);
  sec.append(head, body);
  head.addEventListener("click", () => toggle(sec, head, body));
  QUESTIONS.filter(q => q.section === title).forEach(q => {
    const wrap = document.createElement("div");
    wrap.className = "q";
    wrap.style.setProperty("--d", (0.12 + q.local * 0.07).toFixed(2) + "s");
    const label = document.createElement("label");
    label.htmlFor = q.id;
    const n = document.createElement("span");
    n.className = "n";
    n.textContent = q.local;
    const t = document.createElement("span");
    t.className = "txt";
    t.textContent = q.text;
    label.append(n, t);
    const ta = document.createElement("textarea");
    ta.id = q.id;
    ta.name = q.id;
    ta.placeholder = "Escribe aquí tu respuesta…";
    ta.rows = 3;
    wrap.append(label, ta);
    inner.append(wrap);
  });
  form.append(sec);
});

const fields = QUESTIONS.map(q => document.getElementById(q.id));

function autoGrow(ta) {
  if (!ta.offsetParent && !ta.closest(".open")) return;
  ta.style.height = "auto";
  ta.style.height = Math.max(84, ta.scrollHeight + 2) + "px";
}
function collect() {
  const a = {};
  QUESTIONS.forEach((q, i) => { a[q.id] = fields[i].value.trim(); });
  return a;
}
function fill(answers) {
  if (!answers) return;
  QUESTIONS.forEach((q, i) => {
    if (typeof answers[q.id] === "string" && answers[q.id]) fields[i].value = answers[q.id];
  });
  fields.forEach(autoGrow);
  updateProgress();
}
function toggle(sec, head, body) {
  const open = !sec.classList.contains("open");
  sec.classList.toggle("open", open);
  head.setAttribute("aria-expanded", String(open));
  body.inert = !open;
  const qs = sec.querySelectorAll(".q");
  if (open) {
    qs.forEach(q => q.classList.remove("in"));
    sec.querySelectorAll("textarea").forEach(autoGrow);
    requestAnimationFrame(() => requestAnimationFrame(() => qs.forEach(q => q.classList.add("in"))));
  }
}
function updateProgress() {
  document.querySelectorAll(".section").forEach(sec => {
    const tas = [...sec.querySelectorAll("textarea")];
    const d = tas.filter(t => t.value.trim()).length;
    const p = sec.querySelector(".prog");
    p.textContent = d + " / " + tas.length;
    p.classList.toggle("full", d === tas.length);
  });
  const done = fields.filter(f => f.value.trim()).length;
  document.getElementById("count").textContent = done + " / " + TOTAL;
  document.getElementById("bar").style.width = (done / TOTAL * 100) + "%";
  return done;
}
function setStatus(msg, kind) {
  statusEl.textContent = msg;
  statusEl.className = "status" + (kind ? " " + kind : "");
}

// Borrador local (solo comodidad en este navegador)
function readDraft() { try { return JSON.parse(localStorage.getItem(DRAFT_KEY) || "null"); } catch (e) { return null; } }
function writeDraft() { try { localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); } catch (e) {} }
let draftTimer;
form.addEventListener("input", e => {
  if (e.target.tagName === "TEXTAREA") autoGrow(e.target);
  updateProgress();
  clearTimeout(draftTimer);
  draftTimer = setTimeout(writeDraft, 600);
});

fill(readDraft());
updateProgress();

// Guardar: deja las respuestas guardadas en este móvil para seguir más tarde
copyBtn.addEventListener("click", () => {
  let ok = true;
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(collect())); } catch (e) { ok = false; }
  if (ok) {
    setStatus("Guardado. Puedes cerrar la página y seguir más tarde desde este mismo móvil y navegador.", "ok");
    copyBtn.textContent = "Guardado ✓";
    setTimeout(() => { copyBtn.textContent = "Guardar y continuar más tarde"; }, 3000);
  } else {
    setStatus("Este navegador no permite guardar (¿modo privado?). Termina el cuestionario y pulsa «Enviar respuestas».", "err");
  }
});

// Intro + pop up (solo si el script corre; sin JS todo se ve quieto)
(function motion() {
  // Abrir siempre desde arriba
  try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (e) {}
  window.scrollTo(0, 0);
  addEventListener("load", () => window.scrollTo(0, 0));
  const root = document.documentElement;
  root.classList.add("anim");
  const io = ("IntersectionObserver" in window) ? new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); }
  }), { threshold: .12, rootMargin: "0px 0px -6% 0px" }) : null;
  function watch() {
    document.querySelectorAll("[data-pop]").forEach(el => io ? io.observe(el) : el.classList.add("in"));
  }
  // Red de seguridad: si algo falla, a los 4 s se ve todo
  setTimeout(() => document.querySelectorAll("[data-pop]").forEach(el => el.classList.add("in")), 4000);

  const intro = document.createElement("div");
  intro.className = "intro";
  intro.setAttribute("aria-hidden", "true");
  const giant = document.createElement("div");
  giant.className = "giant";
  [..."Marta"].forEach((c, i) => {
    const ch = document.createElement("span"); ch.className = "ch";
    const inner = document.createElement("span"); inner.textContent = c; inner.style.setProperty("--i", i);
    ch.append(inner); giant.append(ch);
  });
  const bar = document.createElement("div"); bar.className = "intro-bar";
  const fillBar = document.createElement("i"); bar.append(fillBar);
  intro.append(giant, bar);
  document.body.append(intro);
  const go = () => {
    requestAnimationFrame(() => { intro.classList.add("in"); fillBar.style.width = "100%"; });
    setTimeout(() => {
      window.scrollTo(0, 0);
      intro.classList.add("done");
      setTimeout(watch, 250);
      setTimeout(() => intro.remove(), 1200);
    }, 1500);
  };
  (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(go, go);
})();

// Envío: la web manda las respuestas a un receptor (Google Apps Script de Olaia) que se las reenvía por correo
const ENDPOINT = "https://script.google.com/macros/s/AKfycbwv5vX5hvA3thbcj0tgdc6VJHZeROzSMNSgvmKx2Qlx9r3zEasJvPLO6Hw7wUIfzate/exec";
let sending = false;
saveBtn.addEventListener("click", async () => {
  if (sending) return;
  const done = updateProgress();
  if (done === 0) {
    setStatus("Todavía no has respondido ninguna pregunta.", "err");
    return;
  }
  writeDraft();
  const a = collect();
  const payload = {
    origen: "cuestionario-inicial",
    respuestas: QUESTIONS.map(q => ({ bloque: q.section, n: q.local, pregunta: q.text, respuesta: a[q.id] || "" }))
  };
  sending = true;
  saveBtn.disabled = true;
  setStatus("Enviando…");
  try {
    // text/plain evita la comprobación previa del navegador; la respuesta no se puede leer (no-cors)
    await fetch(ENDPOINT, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
    setStatus("¡Enviado! Muchas gracias. Si quieres cambiar algo, edítalo y vuelve a enviar.", "ok");
    saveBtn.textContent = "Enviado ✓";
    setTimeout(() => { saveBtn.textContent = "Enviar respuestas"; }, 4000);
  } catch (e) {
    setStatus("No se ha podido enviar. Revisa tu conexión y vuelve a intentarlo. Tus respuestas siguen guardadas en este móvil.", "err");
  } finally {
    sending = false;
    saveBtn.disabled = false;
  }
});
setStatus("Cuando termines, pulsa «Enviar respuestas». Lo que escribes se guarda en este móvil aunque cierres la página.");
</script>

</html>
